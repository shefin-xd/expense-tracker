# Render Blueprint for the API. Create it with: Render Dashboard > New > Blueprint > pick this repo.
# The React app is deployed separately on Vercel (see DEPLOYMENT.md).
services:
  - type: web
    name: campusledger-api
    runtime: node
    rootDir: server
    plan: free                       # change to starter to avoid idle spin-down
    region: singapore                # closest to Kerala; pick the one nearest your Atlas cluster
    buildCommand: npm ci --include=dev && npm run build   # tsc is a devDependency
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI             # paste your Atlas connection string in the dashboard
        sync: false
      - key: JWT_SECRET              # Render generates a strong random value once
        generateValue: true
      - key: CLIENT_URL
        value: https://expenses.shefin.dev
      - key: COOKIE_DOMAIN
        value: .shefin.dev
      - key: EMAIL_FROM
        value: CampusLedger <no-reply@shefin.dev>
      - key: SMTP_HOST               # password-reset emails; see DEPLOYMENT.md
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
